name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Postgres (with pgvector) and Redis for integration tests, same images as compose.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agentflow
          POSTGRES_PASSWORD: agentflow
          POSTGRES_DB: agentflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentflow" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      # S3 API for the object-storage integration test (same image as docker compose).
      minio:
        image: bitnamilegacy/minio:2025.5.24
        env:
          MINIO_ROOT_USER: agentflow
          MINIO_ROOT_PASSWORD: agentflow-local-secret
          MINIO_DEFAULT_BUCKETS: agentflow-documents
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans history
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # Lint, format, types, secrets — identical to the local pre-commit hooks.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest
      # The committed OpenAPI schema must match the code; the frontend's types are built from it.
      - name: OpenAPI contract is up to date (run `make api-types` if this fails)
        run: |
          uv run python -c "import json; from agentflow.main import create_app; print(json.dumps(create_app().openapi(), indent=2))" > /tmp/openapi.json
          diff -u ../frontend/src/app/api/openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the OpenAPI schema
        run: npm run api-types && git diff --exit-code src/app/api/schema.ts
      - run: npx prettier --check "src/**/*.{ts,css,html}"
      - run: npm run build
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only (no push) — proves the image builds. Pushing to ECR comes in Phase 7.
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
