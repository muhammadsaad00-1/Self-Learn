# Same checks run locally (on commit) and in CI (`pre-commit run --all-files`).
# Versions are pinned; bump with `make hooks-update`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Secret scanning — spec rule: no secrets in repository/image/logs.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Enforce conventional commit messages (feat:, fix:, docs:, chore: ...).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # mypy runs from the project venv so it sees the real installed dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false
